# Hippo on the NAS (ADR-0019), also usable on the Mac with a Tailscale auth key.
# The backend shares the network of the Tailscale sidecar, which publishes it in HTTPS on the
# tailnet with `tailscale serve` (ADR-0015): no port is opened on the box.
# Variables: infra/.env (not versioned), documented in infra/.env.example.
# Update: docker compose pull && docker compose up -d (migrations run at start).
name: hippo

services:
  tailscale:
    image: tailscale/tailscale:latest
    hostname: hippo
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY:?set TS_AUTHKEY in infra/.env}
      - TS_SERVE_CONFIG=/config/serve.json
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_USERSPACE=false
    volumes:
      - ./tailscale/state:/var/lib/tailscale
      - ./tailscale/config:/config:ro
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
    restart: unless-stopped

  hippo:
    image: ghcr.io/ghislain95/hippo:${HIPPO_IMAGE_TAG:-latest}
    network_mode: service:tailscale
    depends_on:
      - tailscale
    environment:
      - API_TOKEN=${API_TOKEN:?set API_TOKEN in infra/.env}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - ANALYSIS_MODEL=${ANALYSIS_MODEL:-claude-haiku-4-5}
      - BATCH_SCHEDULE=${BATCH_SCHEDULE:-0 2 * * *}
      - BACKUP_SCHEDULE=${BACKUP_SCHEDULE:-0 3 * * *}
      - MONTHLY_BUDGET_USD=${MONTHLY_BUDGET_USD:-5}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - TZ=${TZ:-Europe/Paris}
    volumes:
      - ./data:/data
    mem_limit: 128m
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/hippo", "healthcheck"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
