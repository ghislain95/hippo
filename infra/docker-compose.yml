# Hippo on the NAS (ADR-0019), also usable on the Mac with a Tailscale auth key.
# The backend shares the network of the Tailscale sidecar, which publishes it in HTTPS on the
# tailnet with `tailscale serve` (ADR-0015): no port is opened on the box.
# Variables: infra/.env (not versioned), documented in infra/.env.example.
# Installation, update and rollback: docs/runbook-nas.md. Update: set HIPPO_IMAGE_TAG, then
# docker compose pull && docker compose up -d (migrations run at start).
# Restart the whole project, never the tailscale container alone: it carries hippo's network.
# Invariants checked by `make check-infra` (infra/check-compose.sh): no published port, hippo on
# loopback in the sidecar's network, sidecar in kernel mode, pinned images, log rotation.
name: hippo

# Docker log rotation on every service, so that the logs never fill the NAS volume. json-file
# is the default driver: the UGOS Docker interface reads it as before.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  tailscale:
    # Exact version, bumped by Dependabot (docker-compose ecosystem). The NAS gets a new version
    # only by fetching this file again at a new commit.
    image: tailscale/tailscale:v1.104.4
    hostname: hippo
    environment:
      # The auth key is used once, to enrol the node; then the state in ./tailscale/state is
      # enough and the consumed key can be erased from infra/.env.
      - TS_AUTHKEY=${TS_AUTHKEY:-}
      - TS_AUTH_ONCE=true
      - TS_SERVE_CONFIG=/config/serve.json
      - TS_STATE_DIR=/var/lib/tailscale
      # Kernel mode, never userspace: in userspace mode, netstack forwards a tailnet connection
      # to a port without a serve handler to 127.0.0.1, which would expose :8080 in plain HTTP to
      # the tailnet (design D1 of the deploy-nas change). NET_ADMIN and /dev/net/tun apply to the
      # container's own network namespace, not to the NAS.
      - TS_USERSPACE=false
    volumes:
      - ./tailscale/state:/var/lib/tailscale
      - ./tailscale/config:/config:ro
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
    restart: unless-stopped
    logging: *logging

  hippo:
    # Tag required: a missing line stops `docker compose up` instead of pulling latest. On the
    # NAS, pin sha-<short sha> (docs/runbook-nas.md).
    image: ghcr.io/ghislain95/hippo:${HIPPO_IMAGE_TAG:?set HIPPO_IMAGE_TAG in infra/.env}
    network_mode: service:tailscale
    depends_on:
      tailscale:
        condition: service_started
        # Compose restarts hippo with the sidecar, whose network namespace it uses (Compose 2.17+).
        restart: true
    environment:
      # Listen on loopback only: in the network of the sidecar, :8080 would be reachable in plain
      # HTTP from the tailnet, around tailscale serve.
      - HTTP_ADDR=127.0.0.1:8080
      - API_TOKEN=${API_TOKEN:?set API_TOKEN in infra/.env}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - ANALYSIS_MODEL=${ANALYSIS_MODEL:-claude-haiku-4-5}
      - ANALYSIS_INPUT_PRICE_USD_PER_MTOK=${ANALYSIS_INPUT_PRICE_USD_PER_MTOK:-1}
      - ANALYSIS_OUTPUT_PRICE_USD_PER_MTOK=${ANALYSIS_OUTPUT_PRICE_USD_PER_MTOK:-5}
      - BATCH_SCHEDULE=${BATCH_SCHEDULE:-0 2 * * *}
      - BACKUP_SCHEDULE=${BACKUP_SCHEDULE:-0 3 * * *}
      - MONTHLY_BUDGET_USD=${MONTHLY_BUDGET_USD:-5}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - TZ=${TZ:-Europe/Paris}
    # The image runs as the distroless nonroot user (uid 65532): on the NAS, ./data must belong
    # to it before the first start (sudo chown -R 65532:65532 data), or SQLite cannot create the
    # database.
    volumes:
      - ./data:/data
    # ADR-0038: the nightly batch runs an image copy child of up to 256 MiB beside the service.
    mem_limit: 384m
    restart: unless-stopped
    logging: *logging
    healthcheck:
      test: ["CMD", "/hippo", "healthcheck"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
