# Hippo on the Mac, without Tailscale: the image is built from ../backend and the API is
# published on 127.0.0.1:8080 only (never on the local network). Same image, same volume layout
# as docker-compose.yml. Used by `make up`, `make down`, `make logs`.
# Variables: infra/.env if present (read by Compose from this folder), else the shell.
name: hippo-local

# Docker log rotation, same values as docker-compose.yml.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  hippo:
    build:
      context: ../backend
      args:
        VERSION: ${VERSION:-dev}
    image: hippo:local
    environment:
      - API_TOKEN=${API_TOKEN:?set API_TOKEN in infra/.env or in the shell}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - ANALYSIS_MODEL=${ANALYSIS_MODEL:-claude-haiku-4-5}
      - ANALYSIS_INPUT_PRICE_USD_PER_MTOK=${ANALYSIS_INPUT_PRICE_USD_PER_MTOK:-1}
      - ANALYSIS_OUTPUT_PRICE_USD_PER_MTOK=${ANALYSIS_OUTPUT_PRICE_USD_PER_MTOK:-5}
      - BATCH_SCHEDULE=${BATCH_SCHEDULE:-0 2 * * *}
      - BACKUP_SCHEDULE=${BACKUP_SCHEDULE:-0 3 * * *}
      - MONTHLY_BUDGET_USD=${MONTHLY_BUDGET_USD:-5}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - TZ=${TZ:-Europe/Paris}
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./data:/data
    # ADR-0038: the nightly batch runs an image copy child of up to 256 MiB beside the service.
    mem_limit: 384m
    restart: unless-stopped
    logging: *logging
    healthcheck:
      test: ["CMD", "/hippo", "healthcheck"]
      interval: 10s
      timeout: 5s
      start_period: 5s
      retries: 3
