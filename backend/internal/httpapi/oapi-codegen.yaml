# oapi-codegen configuration (ADR-0031): models, std net/http server, strict interface.
package: httpapi
output: api.gen.go
generate:
  models: true
  std-http-server: true
  strict-server: true
  embedded-spec: false
output-options:
  skip-prune: true
  # Absent versus explicit null in PATCH bodies (design D2 of api-contract-v1).
  nullable-type: true
