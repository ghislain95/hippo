# golangci-lint v2 configuration (ADR-0030). Run with `make lint-backend`; formatters run with
# `make fmt` and after each edit by the agents (.claude/hooks/format-on-edit.sh).
version: "2"

run:
  timeout: 5m

linters:
  default: standard
  enable:
    - bodyclose
    - depguard
    - errorlint
    - gosec
    - misspell
    - nilerr
    - noctx
    - revive
    - rowserrcheck
    - sqlclosecheck
    - unconvert
    - usestdlibvars
  settings:
    misspell:
      # French words of the domain (docs/metier.md section 6, the starting categories), not
      # English misspellings.
      ignore-rules:
        - conteneurs
        - plantes
    depguard:
      # Architecture rules (docs/dev/conventions-backend.md, "Dépendances entre couches").
      rules:
        anthropic-only-in-analysis:
          files:
            - "$all"
            - "!**/internal/analysis/**"
          deny:
            - pkg: github.com/anthropics/anthropic-sdk-go
              desc: only internal/analysis talks to the Anthropic API, behind the Analyzer interface (ADR-0005)
        store-knows-no-transport:
          files:
            - "**/internal/store/**"
          deny:
            - pkg: net/http
              desc: the store knows nothing of HTTP
            - pkg: github.com/ghislain95/hippo/backend/internal/httpapi
              desc: the store sits below the transport
        domains-know-no-transport:
          files:
            - "**/internal/capture/**"
          deny:
            - pkg: net/http
              desc: a domain knows nothing of HTTP; httpapi translates its errors
        capture-knows-no-file-store:
          files:
            - "**/internal/capture/**"
            - "!$test" # the tests build real uploads
          deny:
            - pkg: github.com/ghislain95/hippo/backend/internal/assetfs
              desc: capture consumes its capture.Image interface; httpapi hands it an assetfs.Upload
        assetfs-is-a-leaf:
          files:
            - "**/internal/assetfs/**"
            - "!$test" # its external tests import it
          deny:
            - pkg: net/http
              desc: assetfs stores image files; it knows nothing of HTTP
            - pkg: database/sql
              desc: assetfs knows nothing of the database
            - pkg: github.com/ghislain95/hippo/backend/internal/
              desc: assetfs is a leaf package; it depends on no other package of Hippo
        page-reading-only-in-extraction:
          files:
            - "$all"
            - "!**/internal/extraction/**"
          deny:
            - pkg: codeberg.org/readeck/go-readability
              desc: only internal/extraction reads web pages
            - pkg: golang.org/x/net
              desc: only internal/extraction parses HTML and decodes charsets
            - pkg: github.com/ledongthuc/pdf
              desc: only internal/extraction reads PDFs, in the child process that bounds them (E2-08)
        pdf-generator-only-in-tests:
          files:
            - "$all"
            - "!$test"
          deny:
            - pkg: github.com/ghislain95/hippo/backend/internal/extraction/pdftest
              desc: pdftest builds fictional and hostile PDFs for tests; no production code imports it (E2-08)
        generated-api-only-in-httpapi:
          files:
            - "$all"
            - "!**/internal/httpapi/**"
            - "!**/cmd/hippo/**"
          deny:
            - pkg: github.com/ghislain95/hippo/backend/internal/httpapi
              desc: only cmd/hippo wires the HTTP transport; domains never depend on it
    revive:
      rules:
        - name: exported
        - name: package-comments
        - name: var-naming
        - name: error-strings
        - name: context-as-argument
  exclusions:
    generated: strict
    presets:
      - comments
      - std-error-handling
    rules:
      # Only internal/childproc starts a subprocess: the service's own binary (os.Executable) as
      # the child that reads a page or copies an image, with fixed arguments and an environment
      # of its own (internal/childproc/childproc.go).
      - path: internal/childproc/childproc\.go
        linters:
          - gosec
        text: G204
      # The generator of test PDFs writes the standard security handler of PDF, built on MD5 and
      # RC4 (G401, G405, G501, G503), pseudo-random image bytes (G404) and bytes of codes and
      # offsets it bounds itself (G115); it is imported by tests only (depguard rule
      # pdf-generator-only-in-tests, E2-08).
      - path: internal/extraction/pdftest/
        linters:
          - gosec
        text: "G115|G401|G404|G405|G501|G503"
      - path: _test\.go
        linters:
          - bodyclose # bodies are closed in t.Cleanup by the test helpers
          - gosec
          - noctx

formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/ghislain95/hippo/backend
  exclusions:
    generated: strict
