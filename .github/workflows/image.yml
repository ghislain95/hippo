# Publish the backend image on GHCR (ADR-0019, ADR-0027, ADR-0040). Only from main, after a merge:
# pull requests build the image without pushing it (ci.yml, job `image`). No deployment from
# GitHub: the NAS pulls `latest` by itself every night (RG-99, infra/hippo-update.sh), reads the
# commit the image was built from (its org.opencontainers.image.revision label, set by
# docker/metadata-action) and fetches the deployment files of that commit. A change to one of
# those files publishes a new image too, so that it reaches the NAS with an image built from the
# same commit.
name: Image

on:
  push:
    branches: [main]
    paths:
      - backend/**
      # The deployment files fetched by the NAS at the image's commit (infra/hippo-update.sh).
      - infra/docker-compose.yml
      - infra/tailscale/config/serve.json
      - infra/.env.example
      - infra/hippo-update.sh
      - .github/workflows/image.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: image-main
  cancel-in-progress: false

jobs:
  publish:
    # main only: a workflow_dispatch on another branch would publish a `latest` that the NAS
    # installs without a pull request nor ci-ok.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/hippo
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-
          labels: |
            org.opencontainers.image.title=hippo
            org.opencontainers.image.description=Hippo backend
      # The NAS (Ugreen DXP4800 Plus) is amd64; arm64 runs the production compose on the Mac.
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: backend
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
