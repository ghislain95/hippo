# Dependency updates (ADR-0030): weekly, grouped so that each ecosystem opens one pull request
# at most per week. Each pull request goes through the same CI and review as any change.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    groups:
      go:
        patterns: ["*"]
    commit-message:
      prefix: build
      include: scope

  - package-ecosystem: npm
    directory: /app
    schedule:
      interval: weekly
      day: monday
    groups:
      app:
        patterns: ["*"]
        update-types: [minor, patch]
    # Expo pins its SDK packages: upgrade them with `npx expo install --fix` during an SDK
    # upgrade change, not one by one.
    ignore:
      - dependency-name: "expo*"
        update-types: [version-update:semver-major]
      - dependency-name: "react"
      - dependency-name: "react-dom"
      - dependency-name: "react-native"
      - dependency-name: "react-native-*"
      - dependency-name: "@types/react"
      - dependency-name: "typescript"
    commit-message:
      prefix: build
      include: scope

  - package-ecosystem: npm
    directory: /api
    schedule:
      interval: weekly
      day: monday
    groups:
      api:
        patterns: ["*"]
    commit-message:
      prefix: build
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci

  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: build
      include: scope
