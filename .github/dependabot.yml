# Dependency updates (ADR-0030): weekly, grouped so that each ecosystem opens one pull request
# at most per week. Each pull request goes through the same CI and review as any change.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    groups:
      go:
        patterns: ["*"]
    commit-message:
      prefix: build
      include: scope

  - package-ecosystem: npm
    directory: /app
    schedule:
      interval: weekly
      day: monday
    groups:
      app:
        patterns: ["*"]
        update-types: [minor, patch]
    # Majors of the packages tied to the Expo SDK move together, in an SDK upgrade change run with
    # `npx expo install --fix` (docs/dev/workflow.md, "Dépendances"): the SDK packages and their
    # test and lint companions (jest-expo pins jest; eslint-config-expo breaks on ESLint 10).
    ignore:
      - dependency-name: "*expo*"
        update-types: [version-update:semver-major]
      - dependency-name: "jest"
        update-types: [version-update:semver-major]
      - dependency-name: "@types/jest"
        update-types: [version-update:semver-major]
      - dependency-name: "eslint"
        update-types: [version-update:semver-major]
      - dependency-name: "react"
      - dependency-name: "react-dom"
      - dependency-name: "react-native"
      - dependency-name: "react-native-*"
      - dependency-name: "@types/react"
      - dependency-name: "typescript"
    commit-message:
      prefix: build
      include: scope

  - package-ecosystem: npm
    directory: /api
    schedule:
      interval: weekly
      day: monday
    groups:
      api:
        patterns: ["*"]
    # openapi-typescript 7 requires TypeScript 5: TypeScript moves to a new major only once
    # openapi-typescript supports it.
    ignore:
      - dependency-name: "typescript"
        update-types: [version-update:semver-major]
    commit-message:
      prefix: build
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci

  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: build
      include: scope
